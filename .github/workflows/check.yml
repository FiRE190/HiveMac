name: Check

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Compile every module
        run: python -m compileall -q . -x venv
      - name: Tests (pure modules only, no screen access)
        run: pytest -q

  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build HiveMac.app
        run: scripts/make-app.sh
      - name: Check bundle
        run: |
          plutil -lint build/HiveMac.app/Contents/Info.plist
          codesign --verify --verbose build/HiveMac.app
          test -f build/HiveMac.app/Contents/Resources/HiveMac.icns
          test -x build/HiveMac.app/Contents/Resources/venv/bin/python
          du -sh build/HiveMac.app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: HiveMac.app
          path: build/HiveMac.app

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cd swift && swift test
      - name: Build the native HiveMac.app
        run: swift/scripts/make-app.sh
      - name: Check bundle
        run: |
          plutil -lint swift/build/HiveMac.app/Contents/Info.plist
          codesign --verify --verbose swift/build/HiveMac.app
          test -f swift/build/HiveMac.app/Contents/Resources/HiveMac.icns
          du -sh swift/build/HiveMac.app
